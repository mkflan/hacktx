{% extends "base.html" %}

{% block content %}
        <!--sky-->
        <header class="relative w-full min-h-[500px] bg-blue px-6 py-20 flex flex-col justify-center items-center text-center overflow-hidden">

            <!-- Fluffy Multi-Blob Paper-Cut Clouds -->
            <div class="absolute top-8 left-12 w-52 h-20 bg-pink/70 rounded-full blur-[0.5px] opacity-90 pointer-events-none">
                <div class="absolute -top-4 left-6 w-24 h-20 bg-pink/80 rounded-full"></div>
                <div class="absolute -top-6 right-8 w-28 h-24 bg-pink/70 rounded-full"></div>
            </div>

            <div class="absolute top-16 right-16 w-64 h-24 bg-cream/90 rounded-full blur-[0.5px] opacity-95 pointer-events-none">
                <div class="absolute -top-6 left-8 w-28 h-24 bg-cream/90 rounded-full"></div>
                <div class="absolute -top-4 right-6 w-24 h-20 bg-cream/80 rounded-full"></div>
            </div>

            <!-- Sky Content Wrapper -->
            <div class="relative z-20 max-w-3xl mx-auto flex flex-col items-center justify-center space-y-4">
                <h1 class="text-6xl md:text-8xl lg:text-10xl font-black tracking-normal leading-tight text-slate-900 drop-shadow-sm">
                   Wonderland
                </h1>
                <p class="text-base sm:text-lg font-semibold tracking-normal text-slate-700 max-w-xl">
                    Peer into your peer's projects or submit your work for advice!
                </p>
            </div>

        </header>
        <section class="relative w-full">
            <div class="relative w-full">
            <!-- Midground Grass Layer -->
            <div class="absolute bottom-0 left-0 w-full h-24 bg-[#5c7c65] shadow-inner pointer-events-none"
                 style="clip-path: polygon(0% 30%, 5% 10%, 10% 25%, 15% 5%, 20% 30%, 25% 10%, 30% 35%, 35% 10%, 40% 30%, 45% 5%, 50% 25%, 55% 10%, 60% 20%, 65% 5%, 70% 30%, 75% 10%, 80% 35%, 85% 15%, 90% 30%, 95% 5%, 100% 25%, 100% 100%, 0% 100%);">
            </div>
        </div>
        </section>
        <!-- PAPER-CUT HILLS & GRASS TRANSITION -->

        <section class="relative w-full bg-dirt px-4 pt-4 pb-32 border-t-4 border-[#180e0a] min-h-[500px]">

            <!-- Decorative Root Lines using SVG -->
            <svg class="absolute top-0 left-0 w-full h-32 pointer-events-none opacity-40 z-10" viewBox="0 0 1200 100" preserveAspectRatio="none">
                <path d="M100,0 Q120,40 150,80 T200,100" fill="none" stroke="#5c3a21" stroke-width="4" />
                <path d="M400,0 Q380,50 350,90" fill="none" stroke="#5c3a21" stroke-width="3" />
                <path d="M850,0 Q880,45 920,85 T950,100" fill="none" stroke="#5c3a21" stroke-width="5" />
                <path d="M1100,0 Q1050,40 1020,90" fill="none" stroke="#5c3a21" stroke-width="3" />
            </svg>

            {# TODO: forum posts and the "submit your work" form go here. #}
        </section>
{% endblock %}
